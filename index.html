:root{
  --sand:#938362;
  --terracotta:#C45308;
  --ochre:#BD9147;
  --moss:#6F7656;
  --forest:#1F2A1F;
  --warm-white:#F8F6F2;
  --warm-black:#161513;
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

html,body{
  margin:0;
  padding:0;
  background:var(--forest);
  color:var(--warm-white);
  font-family:'Anybody', sans-serif;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:0 auto;
  padding:0 0 40px;
}

.masthead{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(248,246,242,0.15);
}

.masthead h1{
  font-family:'Awesome Serif', serif;
  font-weight:600;
  font-size:22px;
  letter-spacing:0.2px;
  margin:0 0 2px;
  color:var(--warm-white);
}

.masthead p{
  margin:0;
  font-size:12.5px;
  color:var(--sand);
  line-height:1.4;
}

.canvas-zone{
  padding:18px 20px 8px;
}

.canvas-frame{
  position:relative;
  width:100%;
  aspect-ratio:9/16;
  background:
    repeating-conic-gradient(rgba(255,255,255,0.04) 0% 25%, transparent 0% 50%) 50% / 24px 24px,
    var(--warm-black);
  border-radius:2px;
  overflow:hidden;
  border:1px solid rgba(248,246,242,0.18);
  touch-action:none;
  transition:aspect-ratio 0.15s ease;
}

#canvas{
  width:100%;
  height:100%;
  display:block;
  cursor:grab;
}

.empty-state{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-align:center;
  padding:0 40px;
  pointer-events:none;
}

.empty-state .glyph{
  width:34px;
  height:34px;
  border:1.5px solid var(--sand);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  color:var(--sand);
}

.empty-state span.msg{
  font-size:13px;
  color:var(--sand);
  line-height:1.5;
}

.upload-btn{
  display:block;
  width:100%;
  margin-top:10px;
  padding:13px;
  background:transparent;
  border:1px solid rgba(248,246,242,0.3);
  color:var(--warm-white);
  font-family:'Anybody',sans-serif;
  font-size:13px;
  font-weight:600;
  border-radius:2px;
  text-align:center;
}
.upload-btn:active{ background:rgba(248,246,242,0.08); }

#fileInput{ display:none; }

.hint-row{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--sand);
  margin-top:8px;
  padding:0 2px;
}

.panel{
  padding:22px 20px 0;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  font-size:11.5px;
  color:var(--sand);
  margin-bottom:6px;
  font-weight:600;
}

.field input[type=text]{
  width:100%;
  background:rgba(248,246,242,0.06);
  border:1px solid rgba(248,246,242,0.2);
  color:var(--warm-white);
  font-family:'Anybody',sans-serif;
  font-size:15px;
  padding:11px 12px;
  border-radius:2px;
}
.field input[type=text]::placeholder{ color:rgba(248,246,242,0.35); }
.field input[type=text]:focus{ outline:none; border-color:var(--terracotta); }

.row-split{
  display:flex;
  gap:10px;
}
.row-split .field{ flex:1; }

.swatches{
  display:flex;
  gap:10px;
  margin-top:2px;
  flex-wrap:wrap;
}

.swatch{
  width:34px;
  height:34px;
  border-radius:50%;
  border:2px solid rgba(248,246,242,0.25);
  position:relative;
}
.swatch.active{ border-color:var(--warm-white); }
.swatch.active::after{
  content:'';
  position:absolute;
  inset:-5px;
  border:1px solid rgba(248,246,242,0.5);
  border-radius:50%;
}

.segmented{
  display:flex;
  border:1px solid rgba(248,246,242,0.25);
  border-radius:2px;
  overflow:hidden;
}
.segmented button{
  flex:1;
  padding:10px 6px;
  background:transparent;
  border:none;
  color:var(--sand);
  font-family:'Anybody',sans-serif;
  font-size:12.5px;
  font-weight:600;
  border-right:1px solid rgba(248,246,242,0.15);
}
.segmented button:last-child{ border-right:none; }
.segmented button.active{
  background:var(--terracotta);
  color:var(--warm-white);
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:2px;
}
.checkbox-row input{ width:17px; height:17px; accent-color:var(--terracotta); }
.checkbox-row span{ font-size:13px; color:var(--warm-white); }

.divider{
  height:1px;
  background:rgba(248,246,242,0.12);
  margin:22px 0;
}

.section-hidden{ display:none !important; }

.export-btn{
  display:block;
  width:calc(100% - 40px);
  margin:26px 20px 0;
  padding:16px;
  background:var(--terracotta);
  border:none;
  color:var(--warm-white);
  font-family:'Awesome Serif', serif;
  font-weight:600;
  font-size:17px;
  border-radius:2px;
  letter-spacing:0.2px;
}
.export-btn:active{ background:#a84606; }
.export-btn:disabled{ background:rgba(196,83,8,0.35); color:rgba(248,246,242,0.5); }

.reset-link{
  display:block;
  text-align:center;
  margin-top:14px;
  font-size:12px;
  color:var(--sand);
  text-decoration:underline;
  text-underline-offset:2px;
}

.drag-note{
  text-align:center;
  font-size:11px;
  color:var(--sand);
  margin-top:10px;
}
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <h1>Editor de Capas</h1>
    <p>Clip + Rótulo + CTA — sem passar pelo Mac.</p>
  </div>

  <div class="canvas-zone">
    <div class="canvas-frame" id="canvasFrame">
      <canvas id="canvas" width="1080" height="1920"></canvas>
      <div class="empty-state" id="emptyState">
        <div class="glyph">＋</div>
        <span class="msg">carrega uma foto ou<br>um frame do clip</span>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <button class="upload-btn" id="uploadBtn">Carregar imagem</button>
    <div class="hint-row">
      <span id="dimsHint">1080 × 1920</span>
      <span id="statusHint">à espera de imagem</span>
    </div>
    <div class="drag-note">arrasta o texto no ecrã para reposicionar</div>
  </div>

  <div class="panel">

    <div class="row-split">
      <div class="field">
        <label>Formato</label>
        <div class="segmented" id="formatSeg">
          <button data-format="reel" class="active">Reel</button>
          <button data-format="carousel">Carrossel</button>
          <button data-format="square">Quadrado</button>
        </div>
      </div>
      <div class="field">
        <label>Fundo</label>
        <div class="segmented" id="bgSeg">
          <button data-bg="photo" class="active">Foto</button>
          <button data-bg="solid">Sólido</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>Rótulo (a frase principal)</label>
      <input type="text" id="labelText" placeholder="Ex: Quem Nunca Desliga" maxlength="60">
    </div>
    <div class="field">
      <label>Linha de contexto (opcional)</label>
      <input type="text" id="contextText" placeholder="Ex: não é cansaço físico, é mental" maxlength="90">
    </div>
    <div class="field">
      <label>CTA (opcional, linha final)</label>
      <input type="text" id="ctaText" placeholder="Ex: manda isto a quem também nunca desliga" maxlength="80">
    </div>

    <div class="divider"></div>

    <div id="photoOnlyControls">
      <div class="field">
        <label>Cor do rótulo</label>
        <div class="swatches" id="swatchesAccent"></div>
      </div>
      <div class="field">
        <label>Estilo da caixa</label>
        <div class="segmented" id="styleSeg">
          <button data-style="solid" class="active">Sólido</button>
          <button data-style="paper">Papel</button>
        </div>
      </div>
    </div>

    <div id="solidOnlyControls" class="section-hidden">
      <div class="field">
        <label>Cor de fundo</label>
        <div class="swatches" id="swatchesBg"></div>
      </div>
      <div class="field">
        <label>Cor do texto</label>
        <div class="swatches" id="swatchesTextColor"></div>
      </div>
      <div class="field">
        <div class="checkbox-row">
          <input type="checkbox" id="textureToggle" checked>
          <span>Textura de grão (papel/filme)</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Posição</label>
      <div class="segmented" id="posSeg">
        <button data-pos="top" class="active">Topo</button>
        <button data-pos="mid">Centro</button>
        <button data-pos="bottom">Base</button>
      </div>
    </div>
  </div>

  <button class="export-btn" id="exportBtn" disabled>Exportar imagem</button>
  <a class="reset-link" id="resetLink">recomeçar</a>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const emptyState = document.getElementById('emptyState');
const exportBtn = document.getElementById('exportBtn');
const statusHint = document.getElementById('statusHint');
const dimsHint = document.getElementById('dimsHint');
const canvasFrame = document.getElementById('canvasFrame');
const photoOnlyControls = document.getElementById('photoOnlyControls');
const solidOnlyControls = document.getElementById('solidOnlyControls');

const PALETTE = [
  {name:'terracotta', hex:'#C45308', text:'#F8F6F2'},
  {name:'ochre', hex:'#BD9147', text:'#161513'},
  {name:'moss', hex:'#6F7656', text:'#F8F6F2'},
  {name:'forest', hex:'#1F2A1F', text:'#F8F6F2'},
  {name:'warm white', hex:'#F8F6F2', text:'#161513'},
  {name:'warm black', hex:'#161513', text:'#F8F6F2'},
];

const FORMATS = {
  reel:     {w:1080, h:1920, label:'1080 × 1920'},
  carousel: {w:1080, h:1350, label:'1080 × 1350'},
  square:   {w:1080, h:1080, label:'1080 × 1080'},
};

let state = {
  img: null,
  labelText: '',
  contextText: '',
  ctaText: '',
  accent: PALETTE[0],      // box color in photo mode
  bgColor: PALETTE[4],     // background color in solid mode (warm white default)
  textColor: PALETTE[3],   // text color in solid mode (forest default)
  format: 'reel',
  bgMode: 'photo',
  boxStyle: 'solid',
  position: 'top',
  offsetY: 0,
  textureOn: true,
};

let dragging = false;
let dragStartY = 0;
let dragStartOffset = 0;
let grainPattern = null;

function buildSwatchRow(container, palette, activeIdx, onPick) {
  container.innerHTML = '';
  palette.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i === activeIdx ? ' active' : '');
    el.style.background = c.hex;
    if (c.hex.toLowerCase() === '#f8f6f2') el.style.boxShadow = 'inset 0 0 0 1px rgba(22,21,19,0.25)';
    el.addEventListener('click', () => {
      [...container.children].forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      onPick(c);
      draw();
    });
    container.appendChild(el);
  });
}

buildSwatchRow(document.getElementById('swatchesAccent'), PALETTE, 0, c => state.accent = c);
buildSwatchRow(document.getElementById('swatchesBg'), PALETTE, 4, c => state.bgColor = c);
buildSwatchRow(document.getElementById('swatchesTextColor'), PALETTE, 3, c => state.textColor = c);

document.getElementById('formatSeg').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#formatSeg button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.format = btn.dataset.format;
  const f = FORMATS[state.format];
  canvas.width = f.w;
  canvas.height = f.h;
  canvasFrame.style.aspectRatio = f.w + '/' + f.h;
  dimsHint.textContent = f.label;
  state.offsetY = 0;
  draw();
});

document.getElementById('bgSeg').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#bgSeg button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.bgMode = btn.dataset.bg;
  if (state.bgMode === 'solid') {
    photoOnlyControls.classList.add('section-hidden');
    solidOnlyControls.classList.remove('section-hidden');
    emptyState.classList.add('section-hidden');
    exportBtn.disabled = false;
    statusHint.textContent = 'fundo sólido';
  } else {
    photoOnlyControls.classList.remove('section-hidden');
    solidOnlyControls.classList.add('section-hidden');
    if (!state.img) {
      emptyState.classList.remove('section-hidden');
      exportBtn.disabled = true;
      statusHint.textContent = 'à espera de imagem';
    }
  }
  draw();
});

document.querySelectorAll('#posSeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#posSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.position = btn.dataset.pos;
    state.offsetY = 0;
    draw();
  });
});

document.querySelectorAll('#styleSeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#styleSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.boxStyle = btn.dataset.style;
    draw();
  });
});

document.getElementById('textureToggle').addEventListener('change', (e) => {
  state.textureOn = e.target.checked;
  draw();
});

['labelText','contextText','ctaText'].forEach(id => {
  document.getElementById(id).addEventListener('input', (e) => {
    state[id] = e.target.value;
    draw();
  });
});

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      state.img = img;
      emptyState.classList.add('section-hidden');
      exportBtn.disabled = false;
      statusHint.textContent = 'imagem carregada';
      draw();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('resetLink').addEventListener('click', () => {
  state = {img:null, labelText:'', contextText:'', ctaText:'', accent:PALETTE[0], bgColor:PALETTE[4], textColor:PALETTE[3], format:'reel', bgMode:'photo', boxStyle:'solid', position:'top', offsetY:0, textureOn:true};
  document.getElementById('labelText').value = '';
  document.getElementById('contextText').value = '';
  document.getElementById('ctaText').value = '';
  document.getElementById('textureToggle').checked = true;
  buildSwatchRow(document.getElementById('swatchesAccent'), PALETTE, 0, c => state.accent = c);
  buildSwatchRow(document.getElementById('swatchesBg'), PALETTE, 4, c => state.bgColor = c);
  buildSwatchRow(document.getElementById('swatchesTextColor'), PALETTE, 3, c => state.textColor = c);
  document.querySelectorAll('#posSeg button').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('#styleSeg button').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('#formatSeg button').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('#bgSeg button').forEach((b,i) => b.classList.toggle('active', i===0));
  photoOnlyControls.classList.remove('section-hidden');
  solidOnlyControls.classList.add('section-hidden');
  canvas.width = FORMATS.reel.w;
  canvas.height = FORMATS.reel.h;
  canvasFrame.style.aspectRatio = '9/16';
  dimsHint.textContent = FORMATS.reel.label;
  emptyState.classList.remove('section-hidden');
  exportBtn.disabled = true;
  statusHint.textContent = 'à espera de imagem';
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

function wrapText(text, maxWidth, font) {
  ctx.font = font;
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const w of words) {
    const test = current ? current + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

function baseY() {
  const h = canvas.height;
  if (state.position === 'top') return h * 0.14;
  if (state.position === 'mid') return h * 0.42;
  return h * 0.70;
}

function makeGrainPattern() {
  const size = 160;
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  const octx = off.getContext('2d');
  const imgData = octx.createImageData(size, size);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const v = 128 + (Math.random() - 0.5) * 140;
    imgData.data[i] = v;
    imgData.data[i+1] = v;
    imgData.data[i+2] = v;
    imgData.data[i+3] = 255;
  }
  octx.putImageData(imgData, 0, 0);
  grainPattern = ctx.createPattern(off, 'repeat');
}

function fitContain(img, W, H) {
  // used for reference only; we use cover by default for photo backgrounds
}

function drawPhotoBackground() {
  const W = canvas.width, H = canvas.height;
  const img = state.img;
  const imgRatio = img.width / img.height;
  const canvasRatio = W / H;
  let sw, sh, sx, sy;
  if (imgRatio > canvasRatio) {
    sh = img.height;
    sw = sh * canvasRatio;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {
    sw = img.width;
    sh = sw / canvasRatio;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(22,21,19,0.12)');
  grad.addColorStop(0.35,'rgba(22,21,19,0)');
  grad.addColorStop(0.65,'rgba(22,21,19,0)');
  grad.addColorStop(1,'rgba(22,21,19,0.18)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function drawSolidBackground() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = state.bgColor.hex;
  ctx.fillRect(0,0,W,H);
  if (state.textureOn) {
    if (!grainPattern) makeGrainPattern();
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = grainPattern;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    // faint vignette to add depth
    const vg = ctx.createRadialGradient(W/2,H*0.4,H*0.2,W/2,H*0.5,H*0.8);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,0.10)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
  }
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  if (state.bgMode === 'photo') {
    if (state.img) {
      drawPhotoBackground();
    } else {
      ctx.fillStyle = '#1F2A1F';
      ctx.fillRect(0,0,W,H);
    }
  } else {
    drawSolidBackground();
  }

  if (!state.labelText && !state.contextText && !state.ctaText) return;

  const paddingX = Math.round(W * 0.06);
  const maxTextWidth = W - paddingX * 2 - Math.round(W*0.07);
  const labelFontSize = Math.round(W * 0.070);
  const contextFontSize = Math.round(W * 0.0315);
  const ctaFontSize = Math.round(W * 0.028);

  const labelFont = `600 ${labelFontSize}px 'Awesome Serif'`;
  const contextFont = `400 ${contextFontSize}px 'Anybody'`;
  const ctaFont = `600 ${ctaFontSize}px 'Anybody'`;

  const labelLines = state.labelText ? wrapText(state.labelText, maxTextWidth, labelFont) : [];
  const contextLines = state.contextText ? wrapText(state.contextText, maxTextWidth, contextFont) : [];

  const lineGapLabel = labelFontSize * 1.12;
  const lineGapContext = contextFontSize * 1.4;
  const gapBetween = contextLines.length ? labelFontSize * 0.36 : 0;

  const blockHeight = (labelLines.length * lineGapLabel) + gapBetween + (contextLines.length * lineGapContext);

  if (state.bgMode === 'photo') {
    // --- box mode ---
    const boxPadV = Math.round(labelFontSize * 0.58);
    const boxPadH = Math.round(labelFontSize * 0.63);

    let maxLineWidth = 0;
    ctx.font = labelFont;
    labelLines.forEach(l => { maxLineWidth = Math.max(maxLineWidth, ctx.measureText(l).width); });
    ctx.font = contextFont;
    contextLines.forEach(l => { maxLineWidth = Math.max(maxLineWidth, ctx.measureText(l).width); });

    const boxWidth = Math.min(maxLineWidth + boxPadH * 2, W - paddingX * 2);
    const boxHeight = blockHeight + boxPadV * 2;
    const boxX = (W - boxWidth) / 2;
    const boxY = baseY() + state.offsetY;

    if (state.labelText || state.contextText) {
      ctx.save();
      // universal lift-off shadow so the box never blends into a busy/dark photo
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = W * 0.03;
      ctx.shadowOffsetY = W * 0.008;

      if (state.boxStyle === 'solid') {
        ctx.fillStyle = state.accent.hex;
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        ctx.shadowColor = 'transparent';
        // thin edge stroke for definition against similarly-toned backgrounds
        ctx.strokeStyle = 'rgba(248,246,242,0.35)';
        ctx.lineWidth = Math.max(1.5, W*0.0015);
        ctx.strokeRect(boxX+1, boxY+1, boxWidth-2, boxHeight-2);
      } else {
        ctx.fillStyle = '#F8F6F2';
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = state.accent.hex;
        ctx.fillRect(boxX, boxY, boxWidth, Math.max(6, W*0.006));
      }
      ctx.restore();

      const textColor = state.boxStyle === 'solid' ? state.accent.text : '#161513';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';

      let cursorY = boxY + boxPadV + labelFontSize * 0.82;
      ctx.font = labelFont;
      ctx.fillStyle = textColor;
      labelLines.forEach(line => {
        ctx.fillText(line, W/2, cursorY);
        cursorY += lineGapLabel;
      });

      if (contextLines.length) {
        cursorY += gapBetween - lineGapLabel + contextFontSize * 0.9;
        ctx.font = contextFont;
        ctx.globalAlpha = state.boxStyle === 'solid' ? 0.92 : 1;
        ctx.fillStyle = state.boxStyle === 'solid' ? textColor : '#3a3a36';
        contextLines.forEach(line => {
          ctx.fillText(line, W/2, cursorY);
          cursorY += lineGapContext;
        });
        ctx.globalAlpha = 1;
      }
    }
  } else {
    // --- solid background mode: text sits directly on the field, no box ---
    const startY = baseY() + state.offsetY;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    let cursorY = startY + labelFontSize * 0.82;
    ctx.font = labelFont;
    ctx.fillStyle = state.textColor.hex;
    labelLines.forEach(line => {
      ctx.fillText(line, W/2, cursorY);
      cursorY += lineGapLabel;
    });

    if (contextLines.length) {
      cursorY += gapBetween - lineGapLabel + contextFontSize * 0.9;
      ctx.font = contextFont;
      ctx.globalAlpha = 0.82;
      ctx.fillStyle = state.textColor.hex;
      contextLines.forEach(line => {
        ctx.fillText(line, W/2, cursorY);
        cursorY += lineGapContext;
      });
      ctx.globalAlpha = 1;
    }
  }

  // CTA line, always near bottom of frame, independent of drag position
  if (state.ctaText) {
    ctx.save();
    ctx.font = ctaFont;
    ctx.textAlign = 'center';
    const ctaY = H - H*0.062;
    const ctaColor = state.bgMode === 'solid' ? state.textColor.hex : '#F8F6F2';
    ctx.fillStyle = ctaColor;
    ctx.globalAlpha = 0.7;
    const ctaLines = wrapText(state.ctaText, W - paddingX*2, ctaFont);
    let cy = ctaY;
    ctaLines.forEach(line => {
      ctx.fillText(line, W/2, cy);
      cy += ctaFontSize * 1.4;
    });
    ctx.restore();
  }
}

function getCanvasY(clientY) {
  const rect = canvas.getBoundingClientRect();
  const scale = canvas.height / rect.height;
  return (clientY - rect.top) * scale;
}

canvasFrame.addEventListener('pointerdown', (e) => {
  if (!state.img && state.bgMode === 'photo') return;
  dragging = true;
  dragStartY = getCanvasY(e.clientY);
  dragStartOffset = state.offsetY;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const y = getCanvasY(e.clientY);
  state.offsetY = dragStartOffset + (y - dragStartY);
  draw();
});
window.addEventListener('pointerup', () => {
  dragging = false;
  canvas.style.cursor = 'grab';
});

exportBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g,'-');
  link.download = `capa-honest-navigator-${ts}.png`;
  link.href = canvas.toDataURL('image/png', 1.0);
  link.click();
});

document.fonts.load("600 76px 'Awesome Serif'").then(() => {
  document.fonts.load("400 34px 'Anybody'").then(() => {
    document.fonts.load("600 30px 'Anybody'").then(draw);
  });
});
document.fonts.ready.then(draw);
</script>
</body>
</html>
