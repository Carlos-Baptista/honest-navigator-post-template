<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Editor de Capas — Honest Navigator</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Editor de Capas">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C1B17">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-180.png">

<style>
@font-face {
  font-family: 'Awesome Serif';
  src: url('fonts/awesome-serif.ttf') format('truetype-variations');
  font-weight: 100 900;
}
@font-face {
  font-family: 'Anybody';
  src: url('fonts/anybody.ttf') format('truetype-variations');
  font-weight: 100 900;
}

:root{
  --color-bg:           #1C1B17;
  --color-bg-surface:   #222018;
  --color-text-strong:  #EDE5D8;
  --color-text-base:    #C4B49A;
  --color-text-mid:     #8B7D6B;
  --color-orange:       #C8601A;
  --color-sage:         #909C78;
  --color-amber:        #C8A040;
  --color-forest:       #1E2818;
  --color-dim:          #5A5048;
  --color-faint:        #3A3530;
  --color-border:       rgba(200,186,168,0.08);
  --color-border-mid:   rgba(200,186,168,0.14);
  --tracking-wide:  0.06em;
  --tracking-wider: 0.10em;
  --tracking-widest:0.14em;
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

html,body{
  margin:0;
  padding:0;
  background:var(--color-bg);
  color:var(--color-text-base);
  font-family:'Anybody', sans-serif;
  font-weight:300;
  min-height:100vh;
}

.app{
  max-width:520px;
  margin:0 auto;
  padding:0 0 40px;
}

.masthead{
  padding:24px 20px 20px;
  border-bottom:0.5px solid var(--color-border);
}

.masthead h1{
  font-family:'Awesome Serif', serif;
  font-weight:300;
  font-size:28px;
  letter-spacing:0.2px;
  margin:0 0 4px;
  color:var(--color-text-strong);
}

.masthead p{
  margin:0;
  font-size:11px;
  font-weight:400;
  letter-spacing:var(--tracking-wide);
  text-transform:uppercase;
  color:var(--color-text-mid);
  line-height:1.4;
}

.canvas-zone{
  padding:20px 20px 8px;
}

.canvas-frame{
  position:relative;
  width:100%;
  aspect-ratio:9/16;
  background:
    repeating-conic-gradient(rgba(200,186,168,0.04) 0% 25%, transparent 0% 50%) 50% / 24px 24px,
    var(--color-bg-surface);
  overflow:hidden;
  border:0.5px solid var(--color-border-mid);
  transition:aspect-ratio 0.15s ease;
}

#canvas{
  width:100%;
  height:100%;
  display:block;
}

.empty-state{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  text-align:center;
  padding:0 40px;
  pointer-events:none;
}

.empty-state .glyph{
  width:32px;
  height:32px;
  border:0.5px solid var(--color-dim);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  color:var(--color-text-mid);
}

.empty-state span.msg{
  font-size:11px;
  letter-spacing:var(--tracking-wide);
  text-transform:uppercase;
  color:var(--color-text-mid);
  line-height:1.6;
}

.upload-btn{
  display:block;
  width:100%;
  margin-top:12px;
  padding:13px;
  background:transparent;
  border:0.5px solid var(--color-border-mid);
  color:var(--color-text-mid);
  font-family:'Anybody',sans-serif;
  font-size:11px;
  font-weight:400;
  letter-spacing:var(--tracking-wider);
  text-transform:uppercase;
  text-align:center;
  transition:color 0.2s;
}
.upload-btn:active{ color:var(--color-text-strong); }

#fileInput{ display:none; }

.hint-row{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:var(--tracking-wide);
  text-transform:uppercase;
  color:var(--color-dim);
  margin-top:10px;
  padding:0 2px;
}

.panel{
  padding:24px 20px 0;
}

.field{
  margin-bottom:20px;
}

.field label{
  display:block;
  font-size:10px;
  font-weight:400;
  letter-spacing:var(--tracking-widest);
  text-transform:uppercase;
  color:var(--color-text-mid);
  margin-bottom:8px;
}

.field input[type=text]{
  width:100%;
  background:transparent;
  border:0.5px solid var(--color-faint);
  color:var(--color-text-strong);
  font-family:'Anybody',sans-serif;
  font-weight:300;
  font-size:15px;
  padding:11px 12px;
}
.field input[type=text]::placeholder{ color:var(--color-dim); }
.field input[type=text]:focus{ outline:none; border-color:var(--color-orange); }

.field input[type=range]{
  width:100%;
  accent-color:var(--color-orange);
  height:24px;
}

.row-split{
  display:flex;
  gap:10px;
}
.row-split .field{ flex:1; }

.swatches{
  display:flex;
  gap:10px;
  margin-top:2px;
  flex-wrap:wrap;
}

.swatch{
  width:32px;
  height:32px;
  border:0.5px solid var(--color-border-mid);
  position:relative;
}
.swatch.active::after{
  content:'';
  position:absolute;
  inset:-5px;
  border:0.5px solid var(--color-text-mid);
}

.segmented{
  display:flex;
  border-bottom:0.5px solid var(--color-border-mid);
}
.segmented button{
  flex:1;
  padding:10px 4px;
  background:transparent;
  border:none;
  color:var(--color-text-mid);
  font-family:'Anybody',sans-serif;
  font-size:10.5px;
  font-weight:400;
  letter-spacing:var(--tracking-wider);
  text-transform:uppercase;
  border-right:0.5px solid var(--color-border-mid);
  transition:color 0.2s;
}
.segmented button:last-child{ border-right:none; }
.segmented button.active{
  color:var(--color-text-strong);
}
.segmented button.active::before{ content:'[ '; color:var(--color-dim); }
.segmented button.active::after{ content:' ]'; color:var(--color-dim); }

.checkbox-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:2px;
}
.checkbox-row input{ width:16px; height:16px; accent-color:var(--color-orange); }
.checkbox-row span{
  font-size:11px;
  letter-spacing:var(--tracking-wide);
  text-transform:uppercase;
  color:var(--color-text-base);
}

.divider{
  height:0.5px;
  background:var(--color-border);
  margin:24px 0;
}

.section-hidden{ display:none !important; }

.export-btn{
  display:block;
  width:calc(100% - 40px);
  margin:32px 20px 0;
  height:52px;
  padding:0;
  background:var(--color-orange);
  border:1px solid rgba(200,96,26,0.5);
  color:var(--color-text-strong);
  font-family:'Anybody', sans-serif;
  font-weight:400;
  font-size:12px;
  letter-spacing:var(--tracking-widest);
  text-transform:uppercase;
  transition:box-shadow 0.2s;
}
.export-btn:active{ box-shadow:0 0 18px rgba(200,96,26,0.3); }
.export-btn:disabled{ background:rgba(200,96,26,0.25); border-color:transparent; color:var(--color-dim); }

.reset-link{
  display:block;
  text-align:center;
  margin-top:16px;
  font-size:10px;
  letter-spacing:var(--tracking-wide);
  text-transform:uppercase;
  color:var(--color-dim);
  text-decoration:underline;
  text-underline-offset:2px;
}
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <h1>Editor de Capas</h1>
    <p>Clip + Rótulo + CTA — sem passar pelo Mac.</p>
  </div>

  <div class="canvas-zone">
    <div class="canvas-frame" id="canvasFrame">
      <canvas id="canvas" width="1080" height="1920"></canvas>
      <div class="empty-state" id="emptyState">
        <div class="glyph">＋</div>
        <span class="msg">carrega uma foto ou<br>um frame do clip</span>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*">
    <button class="upload-btn" id="uploadBtn">Carregar imagem</button>
    <div class="hint-row">
      <span id="dimsHint">1080 × 1920</span>
      <span id="statusHint">à espera de imagem</span>
    </div>
  </div>

  <div class="panel">

    <div class="row-split">
      <div class="field">
        <label>Formato</label>
        <div class="segmented" id="formatSeg">
          <button data-format="reel" class="active">Reel</button>
          <button data-format="carousel">Carrossel</button>
          <button data-format="square">Quadrado</button>
        </div>
      </div>
      <div class="field">
        <label>Fundo</label>
        <div class="segmented" id="bgSeg">
          <button data-bg="photo" class="active">Foto</button>
          <button data-bg="solid">Sólido</button>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>Rótulo (a frase principal)</label>
      <input type="text" id="labelText" placeholder="Ex: Quem Nunca Desliga" maxlength="60">
    </div>
    <div class="field">
      <label>Linha de contexto (opcional)</label>
      <input type="text" id="contextText" placeholder="Ex: não é cansaço físico, é mental" maxlength="90">
    </div>
    <div class="field">
      <label>CTA (opcional, linha final)</label>
      <input type="text" id="ctaText" placeholder="Ex: manda isto a quem também nunca desliga" maxlength="80">
    </div>

    <div class="divider"></div>

    <div id="photoOnlyControls">
      <div class="field">
        <label>Cor do rótulo</label>
        <div class="swatches" id="swatchesAccent"></div>
      </div>
      <div class="field">
        <label>Estilo da caixa</label>
        <div class="segmented" id="styleSeg">
          <button data-style="solid" class="active">Sólido</button>
          <button data-style="paper">Papel</button>
        </div>
      </div>
    </div>

    <div id="solidOnlyControls" class="section-hidden">
      <div class="field">
        <label>Cor de fundo</label>
        <div class="swatches" id="swatchesBg"></div>
      </div>
      <div class="field">
        <label>Cor do texto</label>
        <div class="swatches" id="swatchesTextColor"></div>
      </div>
      <div class="field">
        <div class="checkbox-row">
          <input type="checkbox" id="textureToggle" checked>
          <span>Textura de grão (papel/filme)</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>Posição</label>
      <div class="segmented" id="posSeg">
        <button data-pos="top" class="active">Topo</button>
        <button data-pos="mid">Centro</button>
        <button data-pos="bottom">Base</button>
      </div>
    </div>

    <div class="field">
      <label>Ajuste fino vertical</label>
      <input type="range" id="offsetSlider" min="-300" max="300" value="0">
    </div>
  </div>

  <button class="export-btn" id="exportBtn" disabled>Exportar imagem</button>
  <a class="reset-link" id="resetLink">recomeçar</a>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const emptyState = document.getElementById('emptyState');
const exportBtn = document.getElementById('exportBtn');
const statusHint = document.getElementById('statusHint');
const dimsHint = document.getElementById('dimsHint');
const canvasFrame = document.getElementById('canvasFrame');
const photoOnlyControls = document.getElementById('photoOnlyControls');
const solidOnlyControls = document.getElementById('solidOnlyControls');
const offsetSlider = document.getElementById('offsetSlider');

const PALETTE = [
  {name:'orange', hex:'#C8601A', text:'#EDE5D8'},
  {name:'sage', hex:'#909C78', text:'#1C1B17'},
  {name:'amber', hex:'#C8A040', text:'#1C1B17'},
  {name:'forest', hex:'#1E2818', text:'#EDE5D8'},
  {name:'cream', hex:'#EDE5D8', text:'#1C1B17'},
  {name:'near-black', hex:'#1C1B17', text:'#EDE5D8'},
];

const FORMATS = {
  reel:     {w:1080, h:1920, label:'1080 × 1920'},
  carousel: {w:1080, h:1350, label:'1080 × 1350'},
  square:   {w:1080, h:1080, label:'1080 × 1080'},
};

let state = {
  img: null,
  labelText: '',
  contextText: '',
  ctaText: '',
  accent: PALETTE[0],
  bgColor: PALETTE[4],
  textColor: PALETTE[3],
  format: 'reel',
  bgMode: 'photo',
  boxStyle: 'solid',
  position: 'top',
  offsetY: 0,
  textureOn: true,
};

let grainPattern = null;

function buildSwatchRow(container, palette, activeIdx, onPick) {
  container.innerHTML = '';
  palette.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i === activeIdx ? ' active' : '');
    el.style.background = c.hex;
    if (c.hex.toLowerCase() === '#ede5d8') el.style.boxShadow = 'inset 0 0 0 1px rgba(28,27,23,0.25)';
    el.addEventListener('click', () => {
      [...container.children].forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      onPick(c);
      draw();
    });
    container.appendChild(el);
  });
}

buildSwatchRow(document.getElementById('swatchesAccent'), PALETTE, 0, c => state.accent = c);
buildSwatchRow(document.getElementById('swatchesBg'), PALETTE, 4, c => state.bgColor = c);
buildSwatchRow(document.getElementById('swatchesTextColor'), PALETTE, 3, c => state.textColor = c);

document.getElementById('formatSeg').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#formatSeg button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.format = btn.dataset.format;
  const f = FORMATS[state.format];
  canvas.width = f.w;
  canvas.height = f.h;
  canvasFrame.style.aspectRatio = f.w + '/' + f.h;
  dimsHint.textContent = f.label;
  draw();
});

document.getElementById('bgSeg').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#bgSeg button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.bgMode = btn.dataset.bg;
  if (state.bgMode === 'solid') {
    photoOnlyControls.classList.add('section-hidden');
    solidOnlyControls.classList.remove('section-hidden');
    emptyState.classList.add('section-hidden');
    exportBtn.disabled = false;
    statusHint.textContent = 'fundo sólido';
  } else {
    photoOnlyControls.classList.remove('section-hidden');
    solidOnlyControls.classList.add('section-hidden');
    if (!state.img) {
      emptyState.classList.remove('section-hidden');
      exportBtn.disabled = true;
      statusHint.textContent = 'à espera de imagem';
    }
  }
  draw();
});

document.querySelectorAll('#posSeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#posSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.position = btn.dataset.pos;
    draw();
  });
});

document.querySelectorAll('#styleSeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#styleSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.boxStyle = btn.dataset.style;
    draw();
  });
});

document.getElementById('textureToggle').addEventListener('change', (e) => {
  state.textureOn = e.target.checked;
  draw();
});

offsetSlider.addEventListener('input', (e) => {
  state.offsetY = parseInt(e.target.value, 10);
  draw();
});

['labelText','contextText','ctaText'].forEach(id => {
  document.getElementById(id).addEventListener('input', (e) => {
    state[id] = e.target.value;
    draw();
  });
});

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      state.img = img;
      emptyState.classList.add('section-hidden');
      exportBtn.disabled = false;
      statusHint.textContent = 'imagem carregada';
      draw();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('resetLink').addEventListener('click', () => {
  state = {img:null, labelText:'', contextText:'', ctaText:'', accent:PALETTE[0], bgColor:PALETTE[4], textColor:PALETTE[3], format:'reel', bgMode:'photo', boxStyle:'solid', position:'top', offsetY:0, textureOn:true};
  document.getElementById('labelText').value = '';
  document.getElementById('contextText').value = '';
  document.getElementById('ctaText').value = '';
  document.getElementById('textureToggle').checked = true;
  offsetSlider.value = 0;
  buildSwatchRow(document.getElementById('swatchesAccent'), PALETTE, 0, c => state.accent = c);
  buildSwatchRow(document.getElementById('swatchesBg'), PALETTE, 4, c => state.bgColor = c);
  buildSwatchRow(document.getElementById('swatchesTextColor'), PALETTE, 3, c => state.textColor = c);
  document.querySelectorAll('#posSeg button').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('#styleSeg button').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('#formatSeg button').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('#bgSeg button').forEach((b,i) => b.classList.toggle('active', i===0));
  photoOnlyControls.classList.remove('section-hidden');
  solidOnlyControls.classList.add('section-hidden');
  canvas.width = FORMATS.reel.w;
  canvas.height = FORMATS.reel.h;
  canvasFrame.style.aspectRatio = '9/16';
  dimsHint.textContent = FORMATS.reel.label;
  emptyState.classList.remove('section-hidden');
  exportBtn.disabled = true;
  statusHint.textContent = 'à espera de imagem';
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

function wrapText(text, maxWidth, font) {
  ctx.font = font;
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const w of words) {
    const test = current ? current + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = w;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

function baseY() {
  const h = canvas.height;
  if (state.position === 'top') return h * 0.14;
  if (state.position === 'mid') return h * 0.42;
  return h * 0.70;
}

function makeGrainPattern() {
  const size = 160;
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  const octx = off.getContext('2d');
  const imgData = octx.createImageData(size, size);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const v = 128 + (Math.random() - 0.5) * 140;
    imgData.data[i] = v;
    imgData.data[i+1] = v;
    imgData.data[i+2] = v;
    imgData.data[i+3] = 255;
  }
  octx.putImageData(imgData, 0, 0);
  grainPattern = ctx.createPattern(off, 'repeat');
}

function drawPhotoBackground() {
  const W = canvas.width, H = canvas.height;
  const img = state.img;
  const imgRatio = img.width / img.height;
  const canvasRatio = W / H;
  let sw, sh, sx, sy;
  if (imgRatio > canvasRatio) {
    sh = img.height;
    sw = sh * canvasRatio;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {
    sw = img.width;
    sh = sw / canvasRatio;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(22,21,19,0.12)');
  grad.addColorStop(0.35,'rgba(22,21,19,0)');
  grad.addColorStop(0.65,'rgba(22,21,19,0)');
  grad.addColorStop(1,'rgba(22,21,19,0.18)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
}

function drawSolidBackground() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = state.bgColor.hex;
  ctx.fillRect(0,0,W,H);
  if (state.textureOn) {
    if (!grainPattern) makeGrainPattern();
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = grainPattern;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    const vg = ctx.createRadialGradient(W/2,H*0.4,H*0.2,W/2,H*0.5,H*0.8);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,0.10)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
  }
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  if (state.bgMode === 'photo') {
    if (state.img) {
      drawPhotoBackground();
    } else {
      ctx.fillStyle = '#1C1B17';
      ctx.fillRect(0,0,W,H);
    }
  } else {
    drawSolidBackground();
  }

  if (!state.labelText && !state.contextText && !state.ctaText) return;

  const paddingX = Math.round(W * 0.06);
  const maxTextWidth = W - paddingX * 2 - Math.round(W*0.07);
  const labelFontSize = Math.round(W * 0.070);
  const contextFontSize = Math.round(W * 0.0315);
  const ctaFontSize = Math.round(W * 0.028);

  const labelFont = `600 ${labelFontSize}px 'Awesome Serif'`;
  const contextFont = `400 ${contextFontSize}px 'Anybody'`;
  const ctaFont = `600 ${ctaFontSize}px 'Anybody'`;

  const labelLines = state.labelText ? wrapText(state.labelText, maxTextWidth, labelFont) : [];
  const contextLines = state.contextText ? wrapText(state.contextText, maxTextWidth, contextFont) : [];

  const lineGapLabel = labelFontSize * 1.12;
  const lineGapContext = contextFontSize * 1.4;
  const gapBetween = contextLines.length ? labelFontSize * 0.36 : 0;

  const blockHeight = (labelLines.length * lineGapLabel) + gapBetween + (contextLines.length * lineGapContext);

  if (state.bgMode === 'photo') {
    const boxPadV = Math.round(labelFontSize * 0.58);
    const boxPadH = Math.round(labelFontSize * 0.63);

    let maxLineWidth = 0;
    ctx.font = labelFont;
    labelLines.forEach(l => { maxLineWidth = Math.max(maxLineWidth, ctx.measureText(l).width); });
    ctx.font = contextFont;
    contextLines.forEach(l => { maxLineWidth = Math.max(maxLineWidth, ctx.measureText(l).width); });

    const boxWidth = Math.min(maxLineWidth + boxPadH * 2, W - paddingX * 2);
    const boxHeight = blockHeight + boxPadV * 2;
    const boxX = (W - boxWidth) / 2;
    const boxY = baseY() + state.offsetY;

    if (state.labelText || state.contextText) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = W * 0.03;
      ctx.shadowOffsetY = W * 0.008;

      if (state.boxStyle === 'solid') {
        ctx.fillStyle = state.accent.hex;
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = 'rgba(248,246,242,0.35)';
        ctx.lineWidth = Math.max(1.5, W*0.0015);
        ctx.strokeRect(boxX+1, boxY+1, boxWidth-2, boxHeight-2);
      } else {
        ctx.fillStyle = '#EDE5D8';
        ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = state.accent.hex;
        ctx.fillRect(boxX, boxY, boxWidth, Math.max(6, W*0.006));
      }
      ctx.restore();

      const textColor = state.boxStyle === 'solid' ? state.accent.text : '#1C1B17';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';

      let cursorY = boxY + boxPadV + labelFontSize * 0.82;
      ctx.font = labelFont;
      ctx.fillStyle = textColor;
      labelLines.forEach(line => {
        ctx.fillText(line, W/2, cursorY);
        cursorY += lineGapLabel;
      });

      if (contextLines.length) {
        cursorY += gapBetween - lineGapLabel + contextFontSize * 0.9;
        ctx.font = contextFont;
        ctx.globalAlpha = state.boxStyle === 'solid' ? 0.92 : 1;
        ctx.fillStyle = state.boxStyle === 'solid' ? textColor : '#4A4136';
        contextLines.forEach(line => {
          ctx.fillText(line, W/2, cursorY);
          cursorY += lineGapContext;
        });
        ctx.globalAlpha = 1;
      }
    }
  } else {
    const startY = baseY() + state.offsetY;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    let cursorY = startY + labelFontSize * 0.82;
    ctx.font = labelFont;
    ctx.fillStyle = state.textColor.hex;
    labelLines.forEach(line => {
      ctx.fillText(line, W/2, cursorY);
      cursorY += lineGapLabel;
    });

    if (contextLines.length) {
      cursorY += gapBetween - lineGapLabel + contextFontSize * 0.9;
      ctx.font = contextFont;
      ctx.globalAlpha = 0.82;
      ctx.fillStyle = state.textColor.hex;
      contextLines.forEach(line => {
        ctx.fillText(line, W/2, cursorY);
        cursorY += lineGapContext;
      });
      ctx.globalAlpha = 1;
    }
  }

  if (state.ctaText) {
    ctx.save();
    ctx.font = ctaFont;
    ctx.textAlign = 'center';
    const ctaY = H - H*0.062;
    const ctaColor = state.bgMode === 'solid' ? state.textColor.hex : '#EDE5D8';
    ctx.fillStyle = ctaColor;
    ctx.globalAlpha = 0.7;
    const ctaLines = wrapText(state.ctaText, W - paddingX*2, ctaFont);
    let cy = ctaY;
    ctaLines.forEach(line => {
      ctx.fillText(line, W/2, cy);
      cy += ctaFontSize * 1.4;
    });
    ctx.restore();
  }
}

exportBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g,'-');
  link.download = `capa-honest-navigator-${ts}.png`;
  link.href = canvas.toDataURL('image/png', 1.0);
  link.click();
});

document.fonts.load("600 76px 'Awesome Serif'").then(() => {
  document.fonts.load("400 34px 'Anybody'").then(() => {
    document.fonts.load("600 30px 'Anybody'").then(draw);
  });
});
document.fonts.ready.then(draw);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
</body>
